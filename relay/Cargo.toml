[package]
name = "basehub-relay"
version = "0.1.0"
description = "Ретранслятор Basehub Remote: соединяет телефон и Basehub на ПК, содержимое не видит"
authors = ["devteamra"]
edition = "2021"
rust-version = "1.77"
license = "MIT"

[dependencies]
remote-proto = { path = "../remote-proto" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
axum = { version = "0.7", default-features = false, features = ["http1", "tokio", "ws", "query"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde_json = "1"

[dev-dependencies]
remote-proto = { path = "../remote-proto", features = ["client"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
